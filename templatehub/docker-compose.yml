version: '3.8'

services:
  # TemplateHub API
  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://templatehub:templatehub@db:5432/templatehub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key
      TEMPLATEHUB_API_KEY: dev-api-key
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/app/src
    command: npm run dev

  # PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: templatehub
      POSTGRES_USER: templatehub
      POSTGRES_PASSWORD: templatehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migrate.sql:/docker-entrypoint-initdb.d/01-init.sql

  # Redis (for caching)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: templatehub-network
