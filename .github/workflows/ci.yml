name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — tsc · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Full parallelism on CI (the dev box pins this off — it OOMs).
      VITEST_PARALLEL: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      # NEXT_PUBLIC_* are public by design (they ship in the browser bundle);
      # provided so build-time page evaluation doesn't crash into the error boundary.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run web:typecheck
      - run: npm -w @sumaiya/web run lint
      - run: npm run web:test
      - run: npm run web:build

  web-evals:
    name: web — anti-fabrication evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_PARALLEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm -w @sumaiya/web run evals

  whatsapp:
    name: whatsapp — worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
        working-directory: apps/whatsapp

  native:
    name: native — tsc · test · expo export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Root install first: Metro's nodeModulesPaths is [apps/native, repo root],
      # so transitive deps shared by RN/Expo (semver, …) resolve from the root
      # tree while apps/native keeps its own React 19 / Expo 57.
      - run: npm ci
      - run: npm ci --prefer-offline --no-audit
        working-directory: apps/native
      - run: npm run typecheck
        working-directory: apps/native
      - run: npm test
        working-directory: apps/native
      # Guards the invariant that a release build can never be signed with the
      # public debug key, including after a future `expo prebuild --clean`.
      # See apps/native/plugins/with-release-signing.js.
      - run: node scripts/test-release-signing.js
        working-directory: apps/native
      - run: npm run export
        working-directory: apps/native
        env:
          EXPO_NO_TELEMETRY: "1"
