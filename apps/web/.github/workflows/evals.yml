name: Eval harness (merge gate)

# The anti-fabrication & quality moat. Runs on every PR and push to master:
# a PR that regresses match quality, the evidence engine, the orchestrator or
# the language-constraint wiring FAILS here. Deterministic layer only (the AI
# layer needs provider keys and is skipped in CI by design).
on:
  pull_request:
  push:
    branches: [master]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run eval harness (merge gate)
        run: npm run evals
