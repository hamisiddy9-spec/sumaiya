# Verification lab (advisory) — P6
#
# The standing cross-browser + Lighthouse proof for every PR. Runs the FULL
# verify-all.sh stack: tsc · lint · vitest · evals · production build ·
# Playwright E2E (chromium-desktop, chromium-pixel7, webkit-iphone13,
# firefox-desktop) · Lighthouse ratchet.
#
# ADVISORY-FIRST (non-blocking): this workflow reports, it does not gate merge.
# The fast mandatory gate stays evals.yml. Once the lab is trusted in CI (real
# WebKit runner — the local TLS quirk doesn't exist here), promote it to a
# required check in branch protection.
#
# Note: the DB-migration step (verify-db.sh) intentionally stays a local-box
# check — the script skips itself when no Postgres tooling is present, so this
# job exercises everything else.
name: Verification lab (advisory)

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Playwright browsers for the cross-browser E2E + Google Chrome for the
      # Lighthouse ratchet (chrome-launcher finds the stable binary in PATH).
      - name: Install browsers (chromium / webkit / firefox / chrome)
        run: npx playwright install --with-deps chromium webkit firefox chrome

      # The app reads Supabase at runtime (auth.getUser on /assistant and the
      # guest editor). These are NEXT_PUBLIC_* — public by design (they ship in
      # the browser bundle) — provided as repo variables so the E2E pages render
      # instead of crashing into the error boundary (which made `networkidle`
      # never settle and every interaction test time out). See PR #265 review.
      - name: Full verification stack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run verify

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            e2e/reports/
            test-results/
          if-no-files-found: ignore
