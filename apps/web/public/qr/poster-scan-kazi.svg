<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123">
  <rect width="794" height="1123" fill="#FAF5EE"/>

  <!-- Top band: the product name, so the poster is identifiable from across a room -->
  <rect x="0" y="0" width="794" height="150" fill="#211A15"/>
  <text x="397" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="700" fill="#FAF5EE">Sumaiya</text>
  <text x="397" y="120" text-anchor="middle" font-family="Georgia, serif"
        font-size="21" fill="#FAF5EE" opacity="0.75">Msaidizi wako wa kazi</text>

  <!-- The one promise. Swahili first, and NO jargon: "ATS" means nothing to
       the person this poster is for. The pain is that applications vanish with
       no reply — say that, in the words they already use. -->
  <text x="397" y="248" text-anchor="middle" font-family="Georgia, serif"
        font-size="46" font-weight="700" fill="#211A15">Scan hapa kupata kazi</text>
  <text x="397" y="292" text-anchor="middle" font-family="Georgia, serif"
        font-size="22" fill="#211A15" opacity="0.72">CV yako inakataliwa kabla mtu aisome</text>

  <!-- QR, framed so the quiet zone survives printing (a tight crop is the
       single most common reason a printed code will not scan). -->
  <rect x="166" y="340" width="462" height="462" rx="18" fill="#FFFFFF"
        stroke="#211A15" stroke-opacity="0.14" stroke-width="2"/>
  <g transform="translate(197, 371) scale(0.625)">
    <path fill="#ffffff" d="M0 0h37v37H0z"/><path stroke="#000000" d="M4 4.5h7m2 0h1m1 0h2m1 0h1m4 0h1m2 0h7M4 5.5h1m5 0h1m3 0h3m3 0h1m5 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m2 0h2m1 0h1m1 0h2m1 0h1m2 0h1m1 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m2 0h1m3 0h1m2 0h1m2 0h2m1 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m2 0h2m1 0h1m4 0h2m3 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m1 0h5m2 0h2m1 0h2m2 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M13 11.5h1m3 0h1m1 0h4M4 12.5h1m2 0h1m1 0h2m1 0h1m1 0h1m3 0h1m1 0h1m4 0h1m1 0h1M4 13.5h2m1 0h1m1 0h1m1 0h3m1 0h3m1 0h3m2 0h3m2 0h1m2 0h1M5 14.5h1m3 0h2m4 0h5m1 0h3m2 0h6M4 15.5h2m1 0h2m4 0h2m2 0h1m2 0h1m1 0h1m7 0h2M5 16.5h1m2 0h1m1 0h2m2 0h2m2 0h2m1 0h1m1 0h4m2 0h1m1 0h2M5 17.5h2m1 0h1m4 0h2m1 0h5m2 0h1M6 18.5h8m1 0h1m1 0h2m2 0h2m5 0h5M7 19.5h1m3 0h2m3 0h1m2 0h1m1 0h1m1 0h1m4 0h2m1 0h1M4 20.5h1m1 0h2m2 0h1m1 0h1m1 0h2m1 0h1m3 0h1m1 0h1m1 0h1m5 0h1M5 21.5h1m2 0h2m1 0h1m1 0h1m1 0h1m1 0h4m4 0h3m1 0h1m2 0h1M4 22.5h1m1 0h3m1 0h1m2 0h1m2 0h1m1 0h3m3 0h1m1 0h3m2 0h2M7 23.5h3m2 0h3m3 0h1m2 0h2m3 0h1m4 0h2M4 24.5h1m2 0h2m1 0h1m2 0h1m5 0h2m3 0h5m1 0h1M12 25.5h5m1 0h2m1 0h1m2 0h1m3 0h1m1 0h3M4 26.5h7m3 0h1m6 0h2m1 0h1m1 0h1m1 0h1m2 0h1M4 27.5h1m5 0h1m1 0h1m3 0h1m1 0h1m3 0h1m1 0h1m3 0h3m1 0h1M4 28.5h1m1 0h3m1 0h1m3 0h2m5 0h1m2 0h5m2 0h1M4 29.5h1m1 0h3m1 0h1m1 0h1m1 0h1m2 0h1m5 0h1m1 0h2m1 0h3m1 0h1M4 30.5h1m1 0h3m1 0h1m3 0h1m1 0h2m4 0h1m5 0h3m1 0h1M4 31.5h1m5 0h1m2 0h1m3 0h8m1 0h1m1 0h1m2 0h1M4 32.5h7m1 0h2m3 0h1m3 0h1m2 0h1m1 0h1m1 0h1m2 0h1"/>
  </g>

  <text x="397" y="852" text-anchor="middle" font-family="Georgia, serif"
        font-size="25" font-weight="700" fill="#DA4A1C">Piga simu kamera hapa</text>
  <text x="397" y="886" text-anchor="middle" font-family="Georgia, serif"
        font-size="19" fill="#211A15" opacity="0.7">Bure. Hakuna malipo.</text>

  <!-- Three concrete outcomes — what the person gets, not what the app does.
       "Inapita ATS" belonged here and was removed for exactly that reason. -->
  <g font-family="Georgia, serif" font-size="20" fill="#211A15">
    <text x="397" y="956" text-anchor="middle">Jua kwa nini hukuitwa kwenye usaili</text>
    <text x="397" y="992" text-anchor="middle">Tengeneza CV inayovutia mwajiri</text>
    <text x="397" y="1028" text-anchor="middle">Tuma maombi mengi kwa haraka</text>
  </g>

  <rect x="0" y="1049" width="794" height="74" fill="#211A15"/>
  <text x="397" y="1093" text-anchor="middle" font-family="Georgia, serif"
        font-size="19" fill="#FAF5EE">sumaiya.app</text>
</svg>
