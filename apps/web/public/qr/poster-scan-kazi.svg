<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123">
  <rect width="794" height="1123" fill="#FAF5EE"/>

  <!-- Top band: the product name, so the poster is identifiable from across a room -->
  <rect x="0" y="0" width="794" height="150" fill="#211A15"/>
  <text x="397" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="700" fill="#FAF5EE">Sumaiya</text>
  <text x="397" y="120" text-anchor="middle" font-family="Georgia, serif"
        font-size="21" fill="#FAF5EE" opacity="0.75">Msaidizi wako wa kazi</text>

  <!-- The one promise. Swahili first, and NO jargon: "ATS" means nothing to
       the person this poster is for. The pain is that applications vanish with
       no reply — say that, in the words they already use. -->
  <text x="397" y="248" text-anchor="middle" font-family="Georgia, serif"
        font-size="46" font-weight="700" fill="#211A15">Scan hapa kupata kazi</text>
  <text x="397" y="292" text-anchor="middle" font-family="Georgia, serif"
        font-size="22" fill="#211A15" opacity="0.72">CV yako haifiki kwa mwajiri</text>

  <!-- QR, framed so the quiet zone survives printing (a tight crop is the
       single most common reason a printed code will not scan). -->
  <rect x="166" y="340" width="462" height="462" rx="18" fill="#FFFFFF"
        stroke="#211A15" stroke-opacity="0.14" stroke-width="2"/>
  <g transform="translate(197, 371) scale(0.625)">
    
  <!-- The code, unchanged and in its own module coordinates -->
  <path fill="#ffffff" d="M0 0h41v41H0z"/><path stroke="#000000" d="M4 4.5h7m4 0h1m1 0h7m1 0h2m1 0h1m1 0h7M4 5.5h1m5 0h1m1 0h1m2 0h1m2 0h2m2 0h1m7 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m1 0h2m1 0h1m3 0h1m2 0h4m2 0h1m1 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m1 0h1m4 0h3m1 0h2m2 0h1m1 0h1m2 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h1m8 0h2m2 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m1 0h1m1 0h2m1 0h2m3 0h1m3 0h2m2 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M13 11.5h3m2 0h2m3 0h1m2 0h3M6 12.5h1m2 0h5m3 0h2m2 0h1m1 0h2m3 0h2m1 0h5M7 13.5h1m1 0h1m4 0h3m2 0h1m1 0h3m3 0h1m1 0h3m3 0h2M8 14.5h6m3 0h3m2 0h1m1 0h4m1 0h6m1 0h1M5 15.5h5m1 0h5m1 0h1m2 0h1m5 0h2m1 0h1m1 0h1m1 0h1m1 0h2M5 16.5h4m1 0h3m1 0h2m1 0h2m6 0h4m1 0h2m3 0h2M4 17.5h3m2 0h1m1 0h1m4 0h2m2 0h1m3 0h5m1 0h2m1 0h1m2 0h1M5 18.5h1m4 0h1m3 0h3m2 0h4m1 0h1m2 0h1m1 0h2m3 0h1m1 0h1M4 19.5h1m2 0h3m1 0h1m2 0h1m1 0h3m2 0h4m1 0h1m2 0h1m2 0h2m1 0h2M4 20.5h1m3 0h1m1 0h3m1 0h1m1 0h3m1 0h2m1 0h2m1 0h1m3 0h2m1 0h1M5 21.5h3m1 0h1m2 0h2m3 0h4m1 0h4m1 0h1m1 0h3m2 0h1m1 0h1M5 22.5h2m1 0h3m2 0h1m2 0h1m1 0h2m1 0h3m3 0h1m2 0h1m2 0h2m1 0h1M4 23.5h1m2 0h1m5 0h3m5 0h1m1 0h2m2 0h1m1 0h1m1 0h3M6 24.5h5m2 0h1m1 0h2m2 0h2m1 0h1m1 0h1m2 0h2m1 0h2m3 0h1M5 25.5h1m3 0h1m5 0h1m2 0h2m1 0h1m2 0h1m4 0h3m1 0h1m1 0h2M4 26.5h3m1 0h1m1 0h2m4 0h3m1 0h2m1 0h1m2 0h5m1 0h1m1 0h1m1 0h1M6 27.5h1m1 0h2m1 0h1m2 0h1m1 0h2m1 0h3m1 0h2m1 0h2m3 0h3m1 0h1M4 28.5h2m2 0h5m2 0h1m6 0h2m3 0h7m1 0h2M12 29.5h4m1 0h1m1 0h4m1 0h2m1 0h2m3 0h1m2 0h2M4 30.5h7m1 0h1m1 0h1m1 0h6m2 0h1m3 0h1m1 0h1m1 0h3m1 0h1M4 31.5h1m5 0h1m1 0h2m1 0h1m1 0h1m2 0h1m1 0h2m1 0h1m1 0h2m3 0h1m2 0h2M4 32.5h1m1 0h3m1 0h1m2 0h1m3 0h6m1 0h2m1 0h7M4 33.5h1m1 0h3m1 0h1m2 0h3m1 0h2m1 0h1m2 0h3m3 0h1m1 0h2m2 0h1M4 34.5h1m1 0h3m1 0h1m1 0h1m2 0h3m1 0h1m2 0h5m1 0h1m3 0h1m2 0h2M4 35.5h1m5 0h1m4 0h7m3 0h4m1 0h1m2 0h1M4 36.5h7m4 0h3m1 0h2m5 0h1m1 0h1m1 0h1m1 0h2m2 0h1"/>

  <g shape-rendering="auto">
    <!-- Clean field: the mark must not sit on modules -->
    <rect x="17.9" y="17.9" width="5.2" height="5.2"
          rx="1.14" fill="#FFFFFF"/>
    <!-- The mark, scaled from its own 24-unit box into the plate -->
    <g transform="translate(18.680, 18.680) scale(0.1517)">
      <path d="M12 2.6 C 15.1 5 15.6 8.6 13.5 10.8 C 12.7 11.7 11.3 11.7 10.5 10.8 C 8.4 8.6 8.9 5 12 2.6 Z" fill="#DA4A1C" transform="rotate(0 12 12)"/>
      <path d="M12 2.6 C 15.1 5 15.6 8.6 13.5 10.8 C 12.7 11.7 11.3 11.7 10.5 10.8 C 8.4 8.6 8.9 5 12 2.6 Z" fill="#DA4A1C" transform="rotate(120 12 12)" opacity="0.9"/>
      <path d="M12 2.6 C 15.1 5 15.6 8.6 13.5 10.8 C 12.7 11.7 11.3 11.7 10.5 10.8 C 8.4 8.6 8.9 5 12 2.6 Z" fill="#DA4A1C" transform="rotate(240 12 12)" opacity="0.8"/>
      <circle cx="12" cy="12" r="2.1" fill="#211A15"/>
    </g>
  </g>

  </g>

  <text x="397" y="852" text-anchor="middle" font-family="Georgia, serif"
        font-size="25" font-weight="700" fill="#DA4A1C">Lenga kamera hapa</text>
  <text x="397" y="886" text-anchor="middle" font-family="Georgia, serif"
        font-size="19" fill="#211A15" opacity="0.7">Bure kabisa</text>

  <!-- Three concrete outcomes — what the person gets, not what the app does.
       "Inapita ATS" belonged here and was removed for exactly that reason. -->
  <g font-family="Georgia, serif" font-size="20" fill="#211A15">
    <text x="397" y="956" text-anchor="middle">Jua kwa nini hukuitwa kwenye usaili</text>
    <text x="397" y="992" text-anchor="middle">Tengeneza CV inayovutia mwajiri</text>
    <text x="397" y="1028" text-anchor="middle">Tuma maombi mengi kwa haraka</text>
  </g>

  <rect x="0" y="1049" width="794" height="74" fill="#211A15"/>
  <text x="397" y="1093" text-anchor="middle" font-family="Georgia, serif"
        font-size="19" fill="#FAF5EE">sumaiya.app</text>
</svg>
