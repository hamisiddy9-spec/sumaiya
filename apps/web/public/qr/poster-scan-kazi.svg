<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sumaiya poster — "Kazi inakusubiri" ("the job is waiting for you").
  Trim: A4 portrait, 794x1123 design units = 210x297 mm.
  BLEED: 3 mm on EVERY side (canvas 216x303 mm). The espresso top
  band, the espresso footer band and the cream field are all drawn out past
  the trim line (to -11.3429 / +11.3429 units) so a millimetre of drift on the
  guillotine cannot leave a white sliver at the page edge. Nothing inside the
  trim moved: every layout constant is still in A4-at-96dpi units.
  At 300 dpi this rasterises to 2551x3579 px —
  see scripts/render-poster.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="216mm" height="303mm" viewBox="-11.3429 -11.3429 816.6857 1145.6857">

  <!-- Cream field — bleeds on all four sides -->
  <rect x="-11.3429" y="-11.3429" width="816.6857" height="1145.6857" fill="#FAF5EE"/>

  <!-- Top band: the product name, so the poster is identifiable across a room.
       Serif here and ONLY here — the wordmark is the brand asset. -->
  <rect x="-11.3429" y="-11.3429" width="816.6857" height="115.3429" fill="#211A15"/>
  <text x="397" y="64" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="44" font-weight="700" fill="#FAF5EE">Sumaiya</text>
  <text x="397" y="92" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="18" fill="#FAF5EE" opacity="0.75">Msaidizi wako wa kazi</text>

  <!-- Tier 1 — the BENEFIT, not the mechanism. Someone reading only this line
       should still understand what they get. Bold, sentence case, no caps. -->
  <text x="397" y="172" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#211A15">Kazi inakusubiri</text>
  <!-- Tier 2 — the pain it answers, in the words people already use. "ATS" is
       jargon and belongs nowhere near this poster. -->
  <text x="397" y="218" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#211A15" opacity="0.72">CV yako haifiki kwa mwajiri</text>

  <!-- Tier 3 — three concrete outcomes: what the person gets, not what the app
       does. "Inapita ATS" belonged here and was removed for exactly that reason. -->
  <g fill="#211A15">
    <text x="397" y="266" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20">Jua kwa nini hukuitwa kwenye usaili</text>
    <text x="397" y="294" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20">Tengeneza CV inayovutia mwajiri</text>
    <text x="397" y="322" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20">Tuma maombi mengi kwa haraka</text>
  </g>

  <!-- The code. Plate is 568 units (15.02 cm) around a 540-unit
       canvas (14.28 cm) whose 4-module quiet zone is part of the
       artwork — 14 units of plate padding sit OUTSIDE that, so the white
       margin around the ink is 4 modules plus padding on every side. The ink is
       37 modules x 12 = 444 units = 11.74 cm across: see note 3. -->
  <rect x="113" y="348" width="568" height="568" rx="20" fill="#FFFFFF"
        stroke="#211A15" stroke-opacity="0.14" stroke-width="2"/>
  <g transform="translate(127, 362) scale(12)" shape-rendering="crispEdges">
    
  <!-- The code, unchanged and in its own module coordinates -->
  <path fill="#ffffff" d="M0 0h45v45H0z"/><path stroke="#000000" d="M4 4.5h7m2 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h2m4 0h2m1 0h1m1 0h7M4 5.5h1m5 0h1m2 0h2m1 0h1m1 0h2m1 0h4m4 0h2m3 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m3 0h1m3 0h2m1 0h1m2 0h3m1 0h3m1 0h1m1 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m2 0h2m1 0h1m3 0h1m3 0h1m2 0h1m1 0h3m2 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m1 0h2m2 0h5m4 0h2m1 0h1m1 0h2m2 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m3 0h5m3 0h1m1 0h4m1 0h2m3 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M12 11.5h1m1 0h1m1 0h1m4 0h2m8 0h2M6 12.5h2m2 0h3m1 0h3m1 0h2m4 0h1m2 0h1m2 0h5m1 0h1M8 13.5h2m8 0h5m2 0h3m1 0h2m1 0h1m2 0h1m1 0h1m1 0h1M5 14.5h3m2 0h3m2 0h1m1 0h2m1 0h3m2 0h1m1 0h3m3 0h1m2 0h1m1 0h1M5 15.5h1m1 0h3m1 0h2m1 0h2m2 0h1m1 0h1m3 0h1m1 0h1m2 0h2m4 0h1m1 0h2M5 16.5h1m4 0h2m1 0h2m1 0h1m3 0h2m1 0h1m1 0h1m1 0h1m1 0h3m1 0h2m1 0h5M4 17.5h1m2 0h1m1 0h1m1 0h1m1 0h1m2 0h1m2 0h1m4 0h2m1 0h2m2 0h2m1 0h3m1 0h3M4 18.5h2m1 0h6m1 0h1m1 0h1m1 0h2m4 0h2m3 0h1m6 0h1m1 0h2M4 19.5h2m1 0h1m5 0h1m3 0h1m1 0h1m7 0h1m5 0h2m4 0h2M7 20.5h1m1 0h2m1 0h1m3 0h2m1 0h1m1 0h1m1 0h1m1 0h2m2 0h2m1 0h2m3 0h2m1 0h1M4 21.5h1m1 0h3m4 0h1m1 0h1m1 0h1m2 0h2m1 0h1m1 0h2m1 0h2m1 0h1m2 0h1m3 0h1m1 0h1M5 22.5h1m1 0h9m1 0h2m3 0h1m1 0h1m2 0h2m1 0h3m2 0h1m3 0h2M4 23.5h1m2 0h1m1 0h1m1 0h1m3 0h1m1 0h3m3 0h2m8 0h1m3 0h1m1 0h2M4 24.5h5m1 0h5m1 0h1m2 0h1m1 0h3m1 0h1m2 0h1m1 0h1m1 0h2m2 0h1m3 0h1M4 25.5h1m1 0h1m1 0h2m1 0h3m2 0h1m1 0h1m4 0h1m2 0h1m3 0h1m4 0h1m1 0h1m1 0h1M4 26.5h1m1 0h2m2 0h1m2 0h1m4 0h1m1 0h1m2 0h1m2 0h1m1 0h3m3 0h1m1 0h3M7 27.5h3m1 0h1m5 0h5m3 0h1m1 0h1m1 0h1m1 0h4m3 0h3M6 28.5h1m3 0h2m5 0h1m1 0h2m6 0h1m4 0h7m1 0h1M5 29.5h5m1 0h2m1 0h2m1 0h1m1 0h1m1 0h2m1 0h1m1 0h2m2 0h3m1 0h3m3 0h1M5 30.5h1m2 0h3m1 0h1m2 0h1m3 0h1m4 0h1m3 0h1m8 0h1m1 0h1M4 31.5h1m2 0h3m4 0h1m4 0h1m2 0h2m1 0h1m2 0h1m1 0h1m2 0h1m1 0h3m1 0h2M9 32.5h2m2 0h1m1 0h5m1 0h1m1 0h1m2 0h4m2 0h8M12 33.5h1m1 0h1m1 0h1m3 0h1m1 0h1m1 0h2m1 0h2m1 0h1m1 0h1m3 0h3m1 0h1M4 34.5h7m1 0h1m2 0h2m3 0h3m6 0h2m1 0h1m1 0h1m1 0h2m1 0h2M4 35.5h1m5 0h1m2 0h1m2 0h1m1 0h3m3 0h2m2 0h1m2 0h2m3 0h2M4 36.5h1m1 0h3m1 0h1m3 0h1m1 0h1m1 0h4m3 0h3m2 0h1m1 0h6m1 0h1M4 37.5h1m1 0h3m1 0h1m1 0h2m1 0h2m1 0h7m9 0h1m1 0h3M4 38.5h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h2m2 0h1m1 0h2m1 0h1m2 0h3m2 0h4m1 0h1M4 39.5h1m5 0h1m2 0h3m1 0h4m3 0h1m2 0h3m3 0h2m2 0h2M4 40.5h7m4 0h2m3 0h5m2 0h1m1 0h1m5 0h2m1 0h3"/>

  <g shape-rendering="auto">
    <!-- Clean field: the mark must not sit on modules -->
    <rect x="19.9" y="19.9" width="5.2" height="5.2"
          rx="1.14" fill="#FFFFFF"/>
    <!-- The mark, scaled from its own 24-unit box into the plate -->
    <g transform="translate(20.680, 20.680) scale(0.1517)">
      <path d="M12 2.6 C 15.1 5 15.6 8.6 13.5 10.8 C 12.7 11.7 11.3 11.7 10.5 10.8 C 8.4 8.6 8.9 5 12 2.6 Z" fill="#DA4A1C" transform="rotate(0 12 12)"/>
      <path d="M12 2.6 C 15.1 5 15.6 8.6 13.5 10.8 C 12.7 11.7 11.3 11.7 10.5 10.8 C 8.4 8.6 8.9 5 12 2.6 Z" fill="#DA4A1C" transform="rotate(120 12 12)" opacity="0.9"/>
      <path d="M12 2.6 C 15.1 5 15.6 8.6 13.5 10.8 C 12.7 11.7 11.3 11.7 10.5 10.8 C 8.4 8.6 8.9 5 12 2.6 Z" fill="#DA4A1C" transform="rotate(240 12 12)" opacity="0.8"/>
      <circle cx="12" cy="12" r="2.1" fill="#211A15"/>
    </g>
  </g>

  </g>

  <!-- The scan instruction, demoted to the code it belongs to — it describes the
       action, so it lives with the action (note 1). -->
  <text x="397" y="956" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#DA4A1C">Scan hapa</text>
  <!-- Plain-text address for people who cannot or will not scan: bigger and more
       prominent than the footer, which is now just the brand line. -->
  <text x="397" y="996" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#211A15">sumaiya.app/ats-checker</text>
  <!-- Risk reversal at the point of action. Bold, not italic, not caps. -->
  <text x="397" y="1026" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#DA4A1C">Bure kabisa</text>

  <!-- Footer band — bleeds off the bottom and both sides -->
  <rect x="-11.3429" y="1052" width="816.6857" height="82.34285714285714" fill="#211A15"/>
  <text x="397" y="1094" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#FAF5EE">sumaiya.app</text>
</svg>
