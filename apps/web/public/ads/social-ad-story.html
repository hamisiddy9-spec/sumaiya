<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sumaiya Ad — Story</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .ad-story {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #F8F3ED 0%, #F0E8DE 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 64px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative */
    .circle-top {
      position: absolute;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, #DA4A1C18 0%, transparent 70%);
      border-radius: 50%;
    }
    .circle-bottom {
      position: absolute;
      bottom: -300px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, #12433D12 0%, transparent 70%);
      border-radius: 50%;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .badge {
      display: inline-block;
      background: #DA4A1C;
      color: #FFF;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 14px 36px;
      border-radius: 100px;
      margin-bottom: 48px;
    }

    h1 {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -3px;
      color: #211A15;
      margin-bottom: 24px;
    }
    h1 .highlight {
      color: #DA4A1C;
    }

    p.sub {
      font-size: 32px;
      line-height: 1.4;
      color: #6B5E55;
      margin-bottom: 60px;
      max-width: 800px;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 64px;
      width: 100%;
      max-width: 640px;
    }
    .feature {
      background: #FFF;
      border: 1px solid #E5DDD4;
      border-radius: 16px;
      padding: 20px 32px;
      font-size: 26px;
      font-weight: 600;
      color: #211A15;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(33,26,21,0.05);
    }
    .feature .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #DA4A1C;
      flex-shrink: 0;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #211A15;
      color: #FFF;
      font-size: 36px;
      font-weight: 700;
      padding: 28px 64px;
      border-radius: 18px;
      text-decoration: none;
      box-shadow: 0 8px 32px rgba(33,26,21,0.20);
      transition: transform 0.15s;
    }
    .cta:hover {
      transform: translateY(-3px);
    }
    .cta .arrow {
      font-size: 40px;
    }

    .footer {
      margin-top: 48px;
      font-size: 22px;
      color: #8C7F75;
    }
    .footer strong {
      color: #211A15;
    }
  </style>
</head>
<body>
  <div class="ad-story">
    <div class="circle-top"></div>
    <div class="circle-bottom"></div>
    <div class="content">
      <div class="badge">🇰🇪 🇹🇿 🇺🇬 East Africa</div>
      <h1>
        Land that<br />
        <span class="highlight">first job</span>
      </h1>
      <p class="sub">
        CV, cover letter &amp; business cards —<br />
        built with AI, designed for grads.
      </p>

      <div class="features">
        <div class="feature"><span class="dot"></span> 160+ ATS-optimised CV templates</div>
        <div class="feature"><span class="dot"></span> AI writing assistant &amp; suggestions</div>
        <div class="feature"><span class="dot"></span> Built-in ATS compatibility checker</div>
        <div class="feature"><span class="dot"></span> Free to create — pay only to download</div>
      </div>

      <a class="cta" href="https://www.templatehub.pro/editor/cv/try" target="_blank">
        Build Your CV Free
        <span class="arrow">→</span>
      </a>

      <div class="footer">
        <strong>templatehub.pro</strong>
      </div>
    </div>
  </div>
</body>
</html>
